<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in space | Aparna Anand</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script data-goatcounter="https://aparnaa.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(800px 500px at 80% 0%, #5a2340, transparent 60%), radial-gradient(700px 500px at 0% 100%, #2e2457, transparent 60%), #110c13; color: #f4eaef; font-family: Manrope, sans-serif; display: grid; place-items: center; text-align: center; overflow: hidden; }
    canvas { position: fixed; inset: 0; z-index: 0; }
    main { position: relative; z-index: 1; padding: 24px; }
    .code { font: 14px "JetBrains Mono", monospace; letter-spacing: .14em; color: #ec9db6; }
    h1 { font: 400 clamp(54px, 10vw, 110px)/1 "Instrument Serif", serif; margin: 18px 0; }
    h1 em { background: linear-gradient(100deg, #ec9db6, #f2c9a0 50%, #b7a3ef); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #c9b4bf; font-size: 18px; max-width: 460px; margin: 0 auto 30px; }
    a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #f4eaef; color: #110c13; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <main>
    <div class="code">404 · PAGE NOT FOUND</div>
    <h1>Lost in <em>space.</em></h1>
    <p>This page drifted off somewhere among the stars. The rest of my work is right where you left it.</p>
    <a href="/">Take me home →</a>
  </main>
  <script>
    const cv = document.getElementById('c'), cx = cv.getContext('2d');
    let W, H, stars = [];
    const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; stars = Array.from({ length: 220 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() ** 2 * 1.4 + .3, p: Math.random() * 7, s: .5 + Math.random() * 1.5 })); };
    size(); addEventListener('resize', size);
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    (function draw(t) {
      cx.clearRect(0, 0, W, H);
      for (const s of stars) { cx.fillStyle = `rgba(255,255,255,${.25 + .6 * (still ? .7 : (.5 + .5 * Math.sin(t / 1000 * s.s + s.p)))})`; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill(); }
      if (!still) requestAnimationFrame(draw);
    })(0);
  </script>
</body>
</html>
